<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Codex ↔ Web LLM Bridge</title>
  <style>
    :root { color-scheme: dark; --bg:#111318; --panel:#1a1d24; --panel2:#20242d; --line:#303642; --text:#f2f4f7; --muted:#9ca5b3; --accent:#10a37f; --warn:#f0ad4e; --danger:#ef6b73; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(circle at 15% 0%,#1d3a3a 0,#111318 42%); color:var(--text); font:14px/1.45 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
    button,select,input,textarea { font:inherit; }
    button { border:1px solid var(--line); background:#252a34; color:var(--text); border-radius:9px; padding:8px 12px; cursor:pointer; }
    button:hover { border-color:#687385; } button.primary { background:var(--accent); border-color:var(--accent); color:#061b15; font-weight:700; }
    button.danger { color:#ffd9dc; border-color:#734047; } button:disabled { opacity:.45; cursor:not-allowed; }
    select,input,textarea { width:100%; border:1px solid var(--line); border-radius:8px; background:#12151b; color:var(--text); padding:8px 9px; outline:none; }
    select:focus,input:focus,textarea:focus { border-color:var(--accent); box-shadow:0 0 0 2px #10a37f2b; }
    textarea { min-height:65px; resize:vertical; }
    .shell { padding:18px; } header { display:flex; justify-content:space-between; align-items:flex-start; gap:15px; margin-bottom:15px; }
    .brand { display:flex; gap:10px; align-items:center; } .logo { width:34px; height:34px; display:grid; place-items:center; border-radius:11px; background:linear-gradient(135deg,#10a37f,#6ee7b7); color:#06251c; font-weight:900; font-size:18px; }
    h1 { margin:0 0 3px; font-size:18px; } .subtitle { color:var(--muted); font-size:12px; } .subtitle b { color:var(--text); }
    .status { display:flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:999px; padding:6px 9px; color:var(--muted); white-space:nowrap; font-size:12px; }
    .dot { width:8px; height:8px; border-radius:50%; background:#737b89; } .dot.good { background:var(--accent); } .dot.warn { background:var(--warn); } .dot.bad { background:var(--danger); }
    .grid { display:grid; grid-template-columns:1.08fr .92fr; gap:12px; } .card { background:color-mix(in srgb,var(--panel) 94%,transparent); border:1px solid var(--line); border-radius:12px; padding:14px; }
    .card h2 { margin:0 0 12px; font-size:14px; } .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; } .field { margin:9px 0; } .field label { display:block; color:var(--muted); font-size:11px; margin-bottom:5px; }
    .browser-list { display:grid; gap:7px; max-height:170px; overflow:auto; } .browser-option { border:1px solid var(--line); background:#15181f; border-radius:9px; padding:9px; cursor:pointer; }
    .browser-option.selected { border-color:var(--accent); background:#10a37f13; } .browser-title { display:flex; justify-content:space-between; gap:8px; font-weight:700; font-size:12px; } .browser-meta { color:var(--muted); font-size:11px; }
    .actions { display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; } .summary { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    .kv { background:#15181f; border-radius:8px; padding:8px; min-height:45px; } .kv small { display:block; color:var(--muted); font-size:10px; margin-bottom:2px; } .kv strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
    .log { min-height:130px; max-height:220px; overflow:auto; background:#0d1015; border:1px solid #252a34; border-radius:8px; padding:9px; white-space:pre-wrap; word-break:break-word; color:#cbd3df; font-size:12px; }
    .empty { color:var(--muted); text-align:center; padding:18px 8px; font-size:12px; } .hint { color:var(--muted); font-size:11px; margin-top:7px; } .hidden { display:none !important; }
    .conversation-bridge { display:grid; grid-template-columns:minmax(0,1fr) 76px minmax(0,1fr); gap:10px; align-items:stretch; }
    .conversation-column { min-width:0; background:color-mix(in srgb,var(--panel) 94%,transparent); border:1px solid var(--line); border-radius:12px; padding:13px; }
    .column-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
    .column-title { display:flex; align-items:center; gap:7px; font-weight:700; } .column-title i { width:8px; height:8px; border-radius:50%; background:var(--accent); display:inline-block; }
    .column-subtitle { color:var(--muted); font-size:11px; margin-top:2px; } .message-stack { display:grid; gap:8px; min-height:116px; max-height:220px; overflow:auto; padding:2px; }
    .message-block { border:1px solid var(--line); border-radius:9px; padding:8px 9px; background:#15181f; white-space:pre-wrap; word-break:break-word; font-size:12px; }
    .message-block.codex { border-left:3px solid #6ee7b7; } .message-block.web { border-right:3px solid #7dd3fc; } .message-meta { color:var(--muted); font-size:10px; margin-bottom:3px; }
    .bridge-link { position:relative; display:flex; align-items:center; justify-content:center; min-height:100%; }
    .bridge-link::before { content:""; width:100%; border-top:2px dashed #536172; position:absolute; top:50%; left:0; }
    .bridge-core { position:relative; z-index:1; width:44px; height:44px; display:grid; place-items:center; border:1px solid #536172; border-radius:50%; background:#171b22; color:#b7c2d0; font-size:18px; }
    .bridge-link.active .bridge-core { color:#d1fae5; border-color:var(--accent); box-shadow:0 0 0 5px #10a37f18; }
    .bridge-link.active::after { content:""; position:absolute; top:calc(50% - 3px); left:0; width:9px; height:6px; border-radius:999px; background:#6ee7b7; box-shadow:0 0 10px #6ee7b7; animation:transport 1.5s linear infinite; }
    @keyframes transport { from { transform:translateX(0); opacity:.2; } 15% { opacity:1; } to { transform:translateX(67px); opacity:.2; } }
    .codex-goal { border:1px dashed #536172; border-radius:9px; padding:9px; color:#d9e2ee; background:#15181f; font-size:12px; min-height:49px; }
    .web-controls { margin-top:11px; border-top:1px solid var(--line); padding-top:9px; }
    .panel-actions { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
    /* The panel is intentionally status-only. All actions happen in the Codex conversation. */
    body.status-only .conversation-column:first-child .message-stack,
    body.status-only .conversation-column:first-child .field,
    body.status-only .conversation-column:first-child .panel-actions,
    body.status-only #webMessages,
    body.status-only .web-controls > .row,
    body.status-only .web-controls > .field,
    body.status-only .web-controls > .panel-actions,
    body.status-only .web-controls > .hint { display:none !important; }
    body.status-only .conversation-column { min-height:150px; }
    body.status-only .conversation-column .column-subtitle { margin-top:8px; }
    @media (max-width:720px) { .grid { grid-template-columns:1fr; } header { flex-direction:column; } }
    @media (max-width:860px) { .conversation-bridge { grid-template-columns:1fr; } .bridge-link { min-height:42px; } .bridge-link::before { width:2px; height:100%; border-top:0; border-left:2px dashed #536172; top:0; left:50%; } .bridge-link.active::after { top:0; left:calc(50% - 3px); animation:transportVertical 1.5s linear infinite; } @keyframes transportVertical { from { transform:translateY(0); opacity:.2; } 15% { opacity:1; } to { transform:translateY(38px); opacity:.2; } } }
  </style>
</head>
<body class="status-only">
  <main class="shell">
    <header>
      <div class="brand"><div class="logo">↔</div><div><h1>Codex ↔ Web LLM</h1><div class="subtitle">当前 Codex 对话内置面板 · <b id="scope">当前对话</b></div></div></div>
      <div class="status"><i id="statusDot" class="dot"></i><span id="statusText">未连接</span></div>
    </header>
    <section class="conversation-bridge">
      <div class="conversation-column">
        <div class="column-head"><div><div class="column-title"><i></i>Codex 对话</div><div class="column-subtitle">连接状态由当前 Codex 对话控制</div></div><span class="status">本地执行端</span></div>
        <div id="codexMessages" class="message-stack"><div class="message-block codex"><div class="message-meta">Codex 任务目标</div>目标由当前 Codex 对话提供。这个面板不创建、不覆盖新的目标。</div></div>
        <div class="field"><label>当前任务来源</label><div class="codex-goal">使用当前 Codex 对话里的目标；单次、指定轮次、持续连接只是这个目标的协作模式。</div></div>
        <div class="field"><label for="message">发送一条 Codex 消息给网页端</label><textarea id="message" placeholder="仅用于单次询问或手动联机；Brain-Hand 会使用当前 Codex 任务目标"></textarea></div>
        <div class="panel-actions"><button id="send" class="primary">发送一次</button><button id="run">按当前目标开始</button></div>
        <div class="field"><label>事件</label><div id="log" class="log">面板已就绪。</div></div>
      </div>
      <div id="bridgeLink" class="bridge-link" aria-label="Codex 与网页端连接状态"><div class="bridge-core">↔</div></div>
      <div class="conversation-column">
        <div class="column-head"><div><div class="column-title"><i></i>网页端对话</div><div class="column-subtitle">选定网页模型、标签页和对话的连接状态</div></div><span id="webState" class="status">未连接</span></div>
        <div id="webMessages" class="message-stack"><div class="message-block web"><div class="message-meta">网页端</div>等待连接到网页模型。</div></div>
        <div class="web-controls">
          <div class="row"><div class="field"><label for="provider">网页模型</label><select id="provider"><option value="chatgpt">ChatGPT Web</option><option value="deepseek">DeepSeek Web</option></select></div><div class="field"><label for="direction">起始方向</label><select id="direction"><option value="codex_to_web">Codex → 网页模型</option><option value="web_to_codex">网页模型 → Codex</option></select></div></div>
          <div class="field"><label>浏览器实例</label><div id="browsers" class="browser-list"><div class="empty">点击“扫描浏览器”开始。</div></div></div>
          <div class="row"><div class="field"><label for="window">窗口</label><select id="window"><option value="">请先扫描</option></select></div><div class="field"><label for="tab">标签页</label><select id="tab"><option value="">请先扫描</option></select></div></div>
          <div class="field"><label for="conversation">网页对话（可选）</label><input id="conversation" placeholder="侧栏标题或对话 URL" /></div>
          <div class="row"><div class="field"><label for="mode">协作模式</label><select id="mode"><option value="one_shot">单次</option><option value="manual">手动连接（0 轮）</option><option value="bounded">指定轮次</option><option value="continuous">持续连接</option></select></div><div id="roundsField" class="field"><label for="rounds">往返轮数（1–50）</label><input id="rounds" type="number" min="1" max="50" value="10" /></div></div>
          <div class="panel-actions"><button id="scan" class="primary">扫描浏览器</button><button id="connect">建立连接</button><button id="focus">定位标签页</button><button id="receive">读取新回复</button></div>
          <div id="summary" class="summary"><div class="empty">尚未建立网页连接。</div></div>
          <div class="panel-actions"><button id="pause">暂停</button><button id="disconnect" class="danger">断开</button><button id="refresh">刷新状态</button></div>
          <div class="hint">虚线代表当前 Codex 对话与选定网页对话的绑定；绿色连接点表示当前连接状态。只进行可见网页操作。</div>
        </div>
      </div>
    </section>
  </main>
  <script>
    const state = { browsers: [], selectedBrowser: "", selectedWindow: "", selectedTab: "", link: null, nextRequestId: 1, pending: new Map() };
    const $ = id => document.getElementById(id);
    const log = message => { const line = `[${new Date().toLocaleTimeString()}] ${String(message ?? "")}`; $("log").textContent = `${line}\n${$("log").textContent}`.slice(0, 10000); };
    const esc = value => String(value ?? "").replace(/[&<>'"]/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[char]));
    function request(method, params = {}, timeout = 15000) {
      if (window.parent === window) return Promise.reject(new Error("当前客户端没有提供 MCP Apps 宿主"));
      const id = state.nextRequestId++;
      window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => { state.pending.delete(id); reject(new Error(`宿主未响应：${method}`)); }, timeout);
        state.pending.set(id, { resolve, reject, timer });
      });
    }
    window.addEventListener("message", event => {
      if (event.source !== window.parent) return;
      const message = event.data;
      if (!message || message.jsonrpc !== "2.0") return;
      if (message.id !== undefined && state.pending.has(message.id)) {
        const pending = state.pending.get(message.id); state.pending.delete(message.id); clearTimeout(pending.timer);
        if (message.error) pending.reject(new Error(message.error.message || "宿主调用失败")); else pending.resolve(message.result);
        return;
      }
      if (message.method === "ui/notifications/tool-input") log("已收到当前工具输入");
      if (message.method === "ui/notifications/tool-result") applyToolResult(message.params || {});
    }, { passive: true });
    function structured(result) { return result?.structuredContent || {}; }
    function applyToolResult(result) {
      const data = structured(result); if (!data || typeof data !== "object") return data;
      if (Array.isArray(data.browsers)) { state.browsers = data.browsers; state.selectedBrowser ||= data.browsers.find(item => item.debugging)?.browser_instance || data.browsers[0]?.browser_instance || ""; renderBrowsers(); renderWindowAndTabs(); }
      if (data.state || data.connected !== undefined || data.bridge) renderSummary(data.bridge || data);
      if (result.isError) log(result.content?.find(item => item.type === "text")?.text || "操作失败");
      return data;
    }
    function appendMessage() { /* Status-only panel: message bodies stay in the Codex conversation. */ }
    function setTransport(active) { $("bridgeLink").classList.toggle("active", Boolean(active)); }
    async function callTool(name, args = {}) { setTransport(["bridge_send","bridge_receive","bridge_run"].includes(name)); const result = await request("tools/call", { name, arguments: args }); const data = applyToolResult(result); const text = result?.content?.find(item => item.type === "text")?.text || `${name} 完成`; log(text); if (name === "bridge_send" && data?.reply) { appendMessage("codex", args.message, "Codex → 网页端"); appendMessage("web", data.reply, "网页端回复"); } if (name === "bridge_receive" && data?.message?.content) appendMessage("web", data.message.content, "网页端 → Codex"); setTransport(["connected","running"].includes(state.link?.state)); return { result, data }; }
    function currentBrowser() { return state.browsers.find(item => item.browser_instance === state.selectedBrowser) || null; }
    function currentWindow() { return currentBrowser()?.windows?.find(item => item.window === state.selectedWindow) || null; }
    function renderBrowsers() {
      const root = $("browsers"); if (!state.browsers.length) { root.innerHTML = '<div class="empty">没有发现可连接的浏览器。请先允许 Edge 网页连接，或启动专用浏览器。</div>'; return; }
      root.innerHTML = state.browsers.map(item => `<div class="browser-option ${item.browser_instance === state.selectedBrowser ? "selected" : ""}" data-browser="${esc(item.browser_instance)}"><div class="browser-title"><span>${esc(item.browser_instance)}</span><span>${item.debugging ? "● 可连接" : "○ 需开启连接"}</span></div><div class="browser-meta">${item.debugging ? `${item.window_count} 个窗口 · ${item.tab_count} 个标签页` : esc(item.unavailable_reason || "尚未允许网页连接")}</div></div>`).join("");
      root.querySelectorAll("[data-browser]").forEach(node => node.onclick = () => { state.selectedBrowser = node.dataset.browser; state.selectedWindow = ""; state.selectedTab = ""; renderBrowsers(); renderWindowAndTabs(); });
    }
    function renderWindowAndTabs() {
      const browser = currentBrowser(); const windows = browser?.windows || []; if (!windows.some(item => item.window === state.selectedWindow)) state.selectedWindow = windows.length === 1 ? windows[0].window : "";
      $("window").innerHTML = windows.length ? '<option value="">选择窗口</option>' + windows.map(item => `<option value="${esc(item.window)}">${esc(item.window)} · ${item.tab_count} 个标签页</option>`).join("") : '<option value="">请先扫描</option>'; $("window").value = state.selectedWindow;
      const provider = $("provider").value; const tabs = (currentWindow()?.tabs || []).filter(item => item.url && (provider === "deepseek" ? item.url.includes("chat.deepseek.com") : item.url.includes("chatgpt.com") || item.url.includes("chat.openai.com")));
      if (!tabs.some(item => String(item.tab_index) === String(state.selectedTab))) state.selectedTab = tabs.length === 1 ? String(tabs[0].tab_index) : "";
      $("tab").innerHTML = tabs.length ? '<option value="">选择标签页</option>' + tabs.map(item => `<option value="${esc(item.tab_index)}">${esc(item.tab_index)} · ${esc(item.title)}</option>`).join("") : '<option value="">没有匹配的网页端标签页</option>'; $("tab").value = state.selectedTab;
    }
    function renderSummary(link) {
      state.link = link || null; const connected = ["ready","connected","running","awaiting_goal"].includes(link?.state); $("statusText").textContent = link?.state || "未连接"; $("webState").textContent = link?.state || "未连接"; $("statusDot").className = `dot ${connected ? (link?.state === "awaiting_goal" ? "warn" : "good") : link?.state === "waiting_for_login" ? "warn" : link?.state === "paused" ? "bad" : ""}`; setTransport(connected);
      if (!link || link.state === "idle") { $("summary").innerHTML = '<div class="empty">尚未建立网页连接。</div>'; return; }
      const fields = [["网页模型",link.provider], ["浏览器",link.browser], ["窗口",link.window], ["标签页",link.tab?.title], ["网页对话",link.conversation?.title || "当前对话未确认"], ["模式",link.mode], ["状态",link.state]];
      $("summary").innerHTML = fields.map(([key,value]) => `<div class="kv"><small>${key}</small><strong title="${esc(value || "")}">${esc(value || "—")}</strong></div>`).join("");
    }
    async function scan() { try { await callTool("bridge_discover"); } catch (error) { log(error.message); } }
    async function refresh() { try { await callTool("bridge_status"); } catch (error) { log(error.message); } }
    function connectionArgs() { const mode = $("mode").value; const relayMode = mode === "manual" ? "bounded" : mode; const args = { provider: $("provider").value, browser: state.selectedBrowser, window: state.selectedWindow, tab: state.selectedTab, conversation: $("conversation").value.trim(), mode: relayMode, rounds: mode === "manual" ? 0 : mode === "bounded" ? Number($("rounds").value || 10) : 1, direction: $("direction").value, goal_source: ["bounded","continuous"].includes(mode) ? "codex_conversation" : "none" }; return Object.fromEntries(Object.entries(args).filter(([,value]) => value !== "")); }
    async function connect() { try { await callTool("bridge_connect", connectionArgs()); } catch (error) { log(error.message); } }
    async function action(name, args = {}) { try { await callTool(name, args); } catch (error) { log(error.message); } }
    $("refresh").onclick = refresh;
    async function start() { try { await request("ui/initialize", { protocolVersion: "2025-06-18", appInfo: { name: "codex-web-bridge", version: "1.0.0" }, appCapabilities: {} }, 1800); } catch { /* Status rendering can continue without an initialization reply. */ } await refresh(); }
    start();
  </script>
</body>
</html>
